<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Status Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .status-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 5px solid #ef4444;
            text-align: left;
        }
        .status-box.active {
            border-left-color: #22c55e;
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #facc15;
            margin-top: 10px;
        }
        .refresh-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .refresh-btn:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>🤖 Bot Time Panel</h2>
        <p>Real-time status monitor para sa iyong Render deployment.</p>
        
        <div id="statusContainer" class="status-box">
            <p>Naglo-load pa ang status...</p>
        </div>

        <button class="refresh-btn" onclick="fetchStatus()">I-refresh ang Status</button>
    </div>

    <script>
        function fetchStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(result => {
                    const container = document.getElementById('statusContainer');
                    if (!result.success) {
                        container.className = "status-box";
                        container.innerHTML = `<p>⚠️ Status: <strong>Error reading data</strong></p>`;
                        return;
                    }

                    const data = result.data;
                    // Kung may threads object ka sa JSON
                    let threadKeys = data.threads ? Object.keys(data.threads) : [];
                    
                    if (threadKeys.length === 0) {
                        container.className = "status-box";
                        container.innerHTML = `<p>🔴 Status: <strong>Wala pang aktibong GC/Thread</strong></p>`;
                        return;
                    }

                    // Kunin ang unang active thread bilang halimbawa sa panel
                    let firstThreadID = threadKeys[0];
                    let threadInfo = data.threads[firstThreadID];
                    let expires = threadInfo.expires || 0;
                    let timeLeft = expires - Date.now();

                    if (timeLeft > 0) {
                        let hours = Math.floor(timeLeft / (1000 * 60 * 60));
                        let mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                        let secs = Math.floor((timeLeft % (1000 * 60)) / 1000);

                        container.className = "status-box active";
                        container.innerHTML = `
                            <p>🟢 Status: <strong>ACTIVE</strong></p>
                            <p>Thread ID: ${firstThreadID}</p>
                            <p>Natitirang Oras:</p>
                            <div class="timer">${hours}h ${mins}m ${secs}s</div>
                        `;
                    } else {
                        container.className = "status-box";
                        container.innerHTML = `
                            <p>🔴 Status: <strong>EXPIRED / OFF</strong></p>
                            <p>I-type ang command sa GC para i-on ulit.</p>
                        `;
                    }
                })
                .catch(err => {
                    document.getElementById('statusContainer').innerHTML = `<p>❌ Error sa pag-connect sa server.</p>`;
                });
        }

        // Auto-refresh bawat 5 segundo
        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
  </html>
